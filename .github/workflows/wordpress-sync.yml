name: Sync WordPress.org SVN

on:
  workflow_dispatch:
  schedule:
    - cron: '13,28,43,58 * * * *'

permissions:
  contents: write

concurrency:
  group: wordpress-svn-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v6

      - name: Install SVN and rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion rsync

      - name: Export and validate WordPress.org SVN
        env:
          SVN_URL: https://plugins.svn.wordpress.org/uwh-site-migrator
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/wordpress-org-export"

          svn export --non-interactive "$SVN_URL" "$SOURCE"

          test -s "$SOURCE/trunk/readme.txt"
          compgen -G "$SOURCE/trunk/*.php" > /dev/null
          test -d "$SOURCE/tags"
          test -d "$SOURCE/assets"

          for dir in trunk tags assets; do
            mkdir -p "$dir"
            rsync -a --delete "$SOURCE/$dir/" "$dir/"
          done

      - name: Commit and push root folders
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Remove the previous mirrored folder ONLY in GitHub.
          # Does not change WordPress.org SVN or unrelated GitHub files.
          git rm -r --ignore-unmatch -- wordpress-org
          git add -A -- trunk tags assets

          if git diff --cached --quiet; then
            echo 'No changes found.'
            exit 0
          fi

          git commit -m 'Sync WordPress.org SVN into repository root'
          git push origin "HEAD:${GITHUB_REF_NAME}"
